# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: FastAPI - Basic Check Pokedex

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  fastapi-tests:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: fastapi-app:latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v3
    - name: Instalar Python 3.13
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
    - name: Instalar Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
         echo "SHOME/.local/bin" >> $GITHUB_PATH
    - name: Instalando as dependências com Poetry
      run: poetry install --no-interaction --no-root
    - name: Testando o arquivo pytest
      run: |
        poetry run pytest
        
    - name: Checkout do arquivo docker
      uses: actions/checkout@v3
    - name: build da imagem docker
      run: docker buildx build -t $ IMAGE_NAME .
    - name: subir container
      run: doker run -d -p 8000:8000 --name app $IMAGE_NAME

    - name: teste da requisição HTTP
      run: |
        curl --fail http://localhost:8000/health
      
      

