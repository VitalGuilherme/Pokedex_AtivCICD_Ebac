input {
 file {
    path => "D:/Arquivos 2025/IntroduçãoAoCICD_Ebac/logstash/logs/app.log"
    start_position => "beginning"
    sincedb_path => "NUL"
    codec => "json"
  }   
}

filter {
    grok {
        match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:loglevel} %{GREEDYDATA:logmessage}" }
    }
    date {
        match => [ "timestamp", "ISO8601" ]
    }
}

output {
    elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "pokedex-logs"
    }
    
    stdout { 
        codec => rubydebug 
    }
}