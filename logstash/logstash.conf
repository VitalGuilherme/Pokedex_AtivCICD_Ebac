input {
 file {
    path => "logs/app.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
  }   
}

filter {
    grok {
        match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:loglevel} %{GREEDYDATA:logmessage}" }
    }
    date {
        match => [ "timestamp", "dd/MM/yyyy HH:mm:ss" ]
    }
}

output {
    elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        port => 9200
        user => "elastic"
        index => "pokedex-logs"
    }
    
    stdout { 
        codec => rubydebug 
    }
}